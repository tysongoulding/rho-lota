[package]
name = "lota"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Desktop UI for rho agentic coding harness"
license.workspace = true
repository.workspace = true

[lib]
name = "lota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.0", default-features = false, features = ["wry"] }
tauri-plugin-opener = "2.0"
serde = { workspace = true }
serde_json = "1.0"
tokio = { workspace = true, features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rho-harness-core = { workspace = true }
rho-engine = { workspace = true }
